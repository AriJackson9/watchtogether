<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WatchTogether</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --purple: #7c3aed;
      --purple-dark: #5b21b6;
      --purple-light: #ede9fe;
      --bg: #0f0a1e;
      --surface: #1a1030;
      --surface2: #241848;
      --text: #f1f0f5;
      --muted: #9b8ec4;
      --border: #2e2060;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── JOIN SCREEN ── */
    #join-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 24px;
    }

    .logo {
      text-align: center;
    }
    .logo-icon { font-size: 56px; }
    .logo h1 { font-size: 24px; font-weight: 700; margin-top: 8px; }
    .logo p { color: var(--muted); font-size: 14px; margin-top: 4px; }

    .form-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .input-group { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .input-group label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

    input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      padding: 12px 14px;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--purple); }
    input.emoji-input { font-size: 22px; text-align: center; width: 60px; padding: 12px 8px; }
    input.code-input { letter-spacing: 4px; font-size: 20px; font-weight: 700; text-align: center; text-transform: uppercase; }

    .btn {
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      padding: 14px;
      transition: opacity 0.15s, transform 0.1s;
      width: 100%;
    }
    .btn:active { transform: scale(0.97); opacity: 0.85; }
    .btn-primary { background: var(--purple); color: #fff; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

    .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    #error-msg { color: #f87171; font-size: 13px; text-align: center; min-height: 18px; }

    /* ── ROOM SCREEN ── */
    #room-screen {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .room-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .room-header-left { display: flex; flex-direction: column; gap: 2px; }
    .room-code-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .room-code-value { font-size: 20px; font-weight: 700; letter-spacing: 3px; color: #c4b5fd; }

    .participants {
      display: flex;
      gap: -4px;
    }
    .avatar-chip {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface2);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      margin-left: -6px;
    }
    .avatar-chip:first-child { margin-left: 0; }

    /* ── SYNC BANNER ── */
    #sync-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: linear-gradient(135deg, #1e1040, #2d1b6e);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      animation: slideDown 0.3s ease;
    }
    @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .sync-icon { font-size: 20px; }
    .sync-text { font-size: 14px; font-weight: 600; }
    .sync-time { margin-left: auto; font-size: 12px; color: var(--muted); background: var(--surface2); padding: 3px 8px; border-radius: 20px; font-family: monospace; }

    /* ── MESSAGES ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }
    #messages::-webkit-scrollbar { display: none; }

    .msg {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .msg.mine { flex-direction: row-reverse; }
    .msg.system { justify-content: center; }

    .msg-avatar { font-size: 18px; flex-shrink: 0; margin-bottom: 2px; }

    .msg-bubble {
      max-width: 72%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg:not(.mine):not(.system) .msg-bubble {
      background: var(--surface2);
      border-bottom-left-radius: 4px;
    }
    .msg.mine .msg-bubble {
      background: var(--purple);
      border-bottom-right-radius: 4px;
    }
    .msg.system .msg-bubble {
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 12px;
    }
    .msg-sender { font-size: 11px; color: var(--muted); margin-bottom: 3px; }

    .reaction-float {
      position: fixed;
      font-size: 36px;
      pointer-events: none;
      animation: floatUp 2.5s ease forwards;
      z-index: 100;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-200px) scale(1.4); opacity: 0; }
    }

    /* ── INPUT BAR ── */
    .input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .reaction-bar {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .reaction-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 20px;
      padding: 6px 10px;
      transition: transform 0.1s, background 0.15s;
      line-height: 1;
    }
    .reaction-btn:active { transform: scale(1.3); background: var(--purple-dark); }

    .chat-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #chat-input {
      flex: 1;
      border-radius: 24px;
      padding: 11px 16px;
      font-size: 15px;
    }
    .send-btn {
      background: var(--purple);
      border: none;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      font-size: 18px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
    }
    .send-btn:active { transform: scale(0.9); }

    /* ── MIC BUTTON ── */
    #mic-btn {
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.1s, background 0.2s;
      background: var(--surface2);
      border: 1px solid var(--border);
      position: relative;
    }
    #mic-btn:active { transform: scale(0.9); }
    #mic-btn.active {
      background: #dc2626;
      border-color: #dc2626;
      box-shadow: 0 0 0 4px rgba(220,38,38,0.25);
      animation: micPulse 1.5s infinite;
    }
    @keyframes micPulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(220,38,38,0.25); }
      50%       { box-shadow: 0 0 0 8px rgba(220,38,38,0.1); }
    }
    #mic-status {
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      margin-top: -4px;
    }
    #mic-status.active { color: #f87171; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ── JOIN SCREEN ── -->
<div id="join-screen">
  <div class="logo">
    <div class="logo-icon">🎬</div>
    <h1>WatchTogether</h1>
    <p>Schau gemeinsam — egal wo</p>
  </div>

  <div class="form-card">
    <div class="input-row">
      <div class="input-group" style="flex:1">
        <label>Dein Name</label>
        <input type="text" id="username" placeholder="z.B. Lena" maxlength="20" autocomplete="off">
      </div>
      <div class="input-group" style="flex:0">
        <label>Emoji</label>
        <input type="text" id="avatar" class="emoji-input" placeholder="😊" maxlength="2">
      </div>
    </div>

    <div class="input-group">
      <label>Room Code</label>
      <input type="text" id="join-code" class="code-input" placeholder="ABC123" maxlength="6" autocomplete="off" inputmode="text">
    </div>

    <div id="error-msg"></div>

    <button class="btn btn-primary" id="join-btn">→ Beitreten</button>
  </div>
</div>

<!-- ── ROOM SCREEN ── -->
<div id="room-screen">
  <div class="room-header">
    <div class="room-header-left">
      <span class="room-code-label">Room</span>
      <span class="room-code-value" id="room-code-display">––––––</span>
    </div>
    <div id="participants-chips" class="participants"></div>
    <button class="btn btn-secondary" id="leave-btn" style="width:auto;padding:8px 16px;font-size:14px;">✕ Verlassen</button>
  </div>

  <div id="sync-banner">
    <span class="sync-icon" id="sync-icon">▶</span>
    <span class="sync-text" id="sync-text">Spielt ab</span>
    <span class="sync-time" id="sync-time">0:00</span>
  </div>

  <div id="messages"></div>

  <div class="input-bar">
    <div class="reaction-bar">
      <button class="reaction-btn" data-emoji="❤️">❤️</button>
      <button class="reaction-btn" data-emoji="😂">😂</button>
      <button class="reaction-btn" data-emoji="😱">😱</button>
      <button class="reaction-btn" data-emoji="👏">👏</button>
      <button class="reaction-btn" data-emoji="🔥">🔥</button>
      <button class="reaction-btn" data-emoji="😭">😭</button>
    </div>
    <div class="chat-row">
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
        <button id="mic-btn" title="Mikrofon">🎤</button>
        <span id="mic-status">Stumm</span>
      </div>
      <input type="text" id="chat-input" placeholder="Nachricht..." maxlength="200" autocomplete="off">
      <button class="send-btn" id="send-btn">➤</button>
    </div>
  </div>
</div>

<script>
  const SERVER = 'https://watchtogether-production-0aa2.up.railway.app';

  let socket = null;
  let myName = '';
  let myAvatar = '😊';
  let myRoom = '';

  const $ = id => document.getElementById(id);

  function formatTime(secs) {
    const s = Math.floor(secs);
    const m = Math.floor(s / 60);
    return `${m}:${String(s % 60).padStart(2, '0')}`;
  }

  function showError(msg) {
    $('error-msg').textContent = msg;
    setTimeout(() => $('error-msg').textContent = '', 3000);
  }

  function addMessage({ from, fromAvatar, text, system, timestamp }) {
    const msgs = $('messages');
    const isMe = from === myName && !system;

    const wrap = document.createElement('div');
    wrap.className = 'msg' + (system ? ' system' : isMe ? ' mine' : '');

    if (system) {
      wrap.innerHTML = `<div class="msg-bubble">${text}</div>`;
    } else {
      wrap.innerHTML = `
        ${!isMe ? `<div class="msg-avatar">${fromAvatar || '👤'}</div>` : ''}
        <div>
          ${!isMe ? `<div class="msg-sender">${from}</div>` : ''}
          <div class="msg-bubble">${escHtml(text)}</div>
        </div>
        ${isMe ? `<div class="msg-avatar">${myAvatar}</div>` : ''}
      `;
    }

    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function floatReaction(emoji) {
    const el = document.createElement('div');
    el.className = 'reaction-float';
    el.textContent = emoji;
    el.style.left = (20 + Math.random() * 60) + '%';
    el.style.bottom = '80px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  function showSyncBanner(icon, text, secs) {
    $('sync-icon').textContent = icon;
    $('sync-text').textContent = text;
    $('sync-time').textContent = formatTime(secs);
    const banner = $('sync-banner');
    banner.style.display = 'flex';
    clearTimeout(banner._timer);
    banner._timer = setTimeout(() => { banner.style.display = 'none'; }, 4000);
  }

  function updateParticipants(users) {
    const el = $('participants-chips');
    el.innerHTML = users.slice(0, 5).map(u =>
      `<div class="avatar-chip" title="${u.name}">${u.avatar || '👤'}</div>`
    ).join('');
  }

  function connectSocket(roomCode) {
    socket = io(SERVER, { transports: ['websocket', 'polling'] });

    socket.on('connect', () => {
      socket.emit('join', {
        roomCode,
        username: myName,
        avatar: myAvatar,
        platform: 'mobile-web'
      });
    });

    setupWebRTCListeners();

    socket.on('room_users', ({ users }) => updateParticipants(users));

    socket.on('chat', (msg) => addMessage(msg));

    socket.on('play', ({ time, from }) => {
      showSyncBanner('▶', `${from} spielt ab`, time);
      addMessage({ system: true, text: `▶ ${from} hat abgespielt bei ${formatTime(time)}` });
    });

    socket.on('pause', ({ time, from }) => {
      showSyncBanner('⏸', `${from} hat pausiert`, time);
      addMessage({ system: true, text: `⏸ ${from} hat pausiert bei ${formatTime(time)}` });
    });

    socket.on('seek', ({ time, from }) => {
      showSyncBanner('⏩', `${from} hat gesprungen`, time);
    });

    socket.on('reaction', ({ from, emoji }) => {
      floatReaction(emoji);
    });

    socket.on('disconnect', () => {
      addMessage({ system: true, text: '⚡ Verbindung getrennt — versuche neu...' });
    });
  }

  // Join button
  $('join-btn').addEventListener('click', async () => {
    const name = $('username').value.trim();
    const avatar = $('avatar').value.trim() || '😊';
    const code = $('join-code').value.trim().toUpperCase();

    if (!name) { showError('Gib deinen Namen ein'); return; }
    if (code.length !== 6) { showError('Room Code muss 6 Zeichen haben'); return; }

    $('join-btn').textContent = 'Verbinde...';
    $('join-btn').disabled = true;

    try {
      const res = await fetch(`${SERVER}/check-room/${code}`);
      if (!res.ok) throw new Error('not found');

      myName = name;
      myAvatar = avatar;
      myRoom = code;

      localStorage.setItem('wt_name', name);
      localStorage.setItem('wt_avatar', avatar);

      $('join-screen').style.display = 'none';
      $('room-screen').style.display = 'flex';
      $('room-code-display').textContent = code;

      connectSocket(code);
    } catch {
      showError('Room nicht gefunden. Code prüfen.');
    } finally {
      $('join-btn').textContent = '→ Beitreten';
      $('join-btn').disabled = false;
    }
  });

  // Leave button
  $('leave-btn').addEventListener('click', () => {
    closeAllPeers();
    roomPeers.clear();
    if (socket) socket.disconnect();
    $('room-screen').style.display = 'none';
    $('join-screen').style.display = 'flex';
    $('messages').innerHTML = '';
    myRoom = '';
  });

  // Send chat
  function sendChat() {
    const input = $('chat-input');
    const text = input.value.trim();
    if (!text || !socket) return;

    socket.emit('chat', { roomCode: myRoom, from: myName, fromAvatar: myAvatar, text, timestamp: Date.now() });
    addMessage({ from: myName, fromAvatar: myAvatar, text });
    input.value = '';
  }

  $('send-btn').addEventListener('click', sendChat);
  $('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

  // Reactions
  document.querySelectorAll('.reaction-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const emoji = btn.dataset.emoji;
      if (!socket) return;
      socket.emit('reaction', { roomCode: myRoom, from: myName, emoji });
      floatReaction(emoji);
    });
  });

  // Code input formatting
  $('join-code').addEventListener('input', e => {
    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  });

  // ── WebRTC ──────────────────────────────────────────────────
  const ICE_CONFIG = { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]};

  let localStream = null;
  let micEnabled = false;
  const peers = new Map(); // socketId -> RTCPeerConnection
  const remoteAudios = new Map(); // socketId -> <audio>

  function setMicUI(on) {
    $('mic-btn').classList.toggle('active', on);
    $('mic-btn').textContent = on ? '🔴' : '🎤';
    $('mic-status').textContent = on ? 'An' : 'Stumm';
    $('mic-status').classList.toggle('active', on);
  }

  async function getLocalStream() {
    if (localStream) return localStream;
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    return localStream;
  }

  async function createPeer(targetId, initiator) {
    if (peers.has(targetId)) return;
    const pc = new RTCPeerConnection(ICE_CONFIG);
    peers.set(targetId, pc);

    // Add local audio
    if (localStream) {
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    }

    // Play remote audio
    pc.ontrack = (e) => {
      let audio = remoteAudios.get(targetId);
      if (!audio) {
        audio = new Audio();
        audio.autoplay = true;
        remoteAudios.set(targetId, audio);
      }
      audio.srcObject = e.streams[0];
    };

    // ICE
    pc.onicecandidate = (e) => {
      if (e.candidate && socket) {
        socket.emit('webrtc_signal', { to: targetId, signal: { type: 'ice', candidate: e.candidate } });
      }
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
        peers.delete(targetId);
      }
    };

    if (initiator) {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('webrtc_signal', { to: targetId, signal: { type: 'offer', sdp: pc.localDescription } });
    }

    return pc;
  }

  async function handleSignal({ signal, from }) {
    if (signal.type === 'offer') {
      await createPeer(from, false);
      const pc = peers.get(from);
      await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit('webrtc_signal', { to: from, signal: { type: 'answer', sdp: pc.localDescription } });
    } else if (signal.type === 'answer') {
      const pc = peers.get(from);
      if (pc) await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
    } else if (signal.type === 'ice') {
      const pc = peers.get(from);
      if (pc && pc.remoteDescription) {
        await pc.addIceCandidate(new RTCIceCandidate(signal.candidate)).catch(() => {});
      }
    }
  }

  function closePeer(socketId) {
    const pc = peers.get(socketId);
    if (pc) { pc.close(); peers.delete(socketId); }
    const audio = remoteAudios.get(socketId);
    if (audio) { audio.srcObject = null; remoteAudios.delete(socketId); }
  }

  function closeAllPeers() {
    for (const [id] of peers) closePeer(id);
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    micEnabled = false;
    setMicUI(false);
  }

  // Mic toggle button
  $('mic-btn').addEventListener('click', async () => {
    if (!socket) return;
    if (!micEnabled) {
      try {
        await getLocalStream();
        micEnabled = true;
        setMicUI(true);
        // Connect to all existing peers in the room
        for (const [socketId] of roomPeers) {
          await createPeer(socketId, true);
        }
      } catch {
        alert('Mikrofon-Zugriff verweigert. Bitte in den Browser-Einstellungen erlauben.');
      }
    } else {
      micEnabled = false;
      if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = false);
      setMicUI(false);
      // Close all peer connections
      for (const [id] of peers) closePeer(id);
    }
  });

  // Track peers in the room for WebRTC
  const roomPeers = new Map(); // socketId -> username

  function setupWebRTCListeners() {
    socket.on('webrtc_peers', (peerList) => {
      peerList.forEach(p => roomPeers.set(p.socketId, p.username));
      if (micEnabled) {
        peerList.forEach(p => createPeer(p.socketId, true));
      }
    });

    socket.on('user_joined_webrtc', ({ socketId, username }) => {
      roomPeers.set(socketId, username);
      if (micEnabled) createPeer(socketId, true);
    });

    socket.on('webrtc_signal', handleSignal);
  }
  // ── End WebRTC ───────────────────────────────────────────────

  // Restore saved name
  const saved = localStorage.getItem('wt_name');
  const savedAvatar = localStorage.getItem('wt_avatar');
  if (saved) $('username').value = saved;
  if (savedAvatar) $('avatar').value = savedAvatar;
